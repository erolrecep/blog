<footer class="text-center footer">
  <hr />
  {{ with .Site.Params.extra }}
  <h6 class="text-center copyright">{{ .copyright | markdownify }}</h6>
  {{ if ne .poweredby false }}
  <h6 class="text-center powered"><a href="https://gohugo.io/">Hugo, themed by </a> <a
      href="https://github.com/kaapiandcode/hugo-goa">hugo-goa</a> <br> <a href="https://creativecommons.org/version4/" >Some Rights Reserved</a> </h6>
  {{ end }}
  {{ if ne .displayrssicon false }}
  <h6>
    <a href="{{ "index.xml" | absURL }}" aria-label="RSS Feed"><i class="fas fa-rss" aria-hidden="true"></i></a>
  </h6>
  {{ end }}
  {{ end }}

</footer>
