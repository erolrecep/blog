<footer class="text-center footer">
  <hr />
  {{ with .Site.Params.extra }}
  <p class="text-center copyright mb-1">{{ .copyright | markdownify }}</p>
  {{ if ne .poweredby false }}
  <p class="text-center powered mb-1"><a href="https://gohugo.io/">Hugo, themed by </a> <a
      href="https://github.com/kaapiandcode/hugo-goa">hugo-goa</a> <br> <a href="https://creativecommons.org/version4/" >Some Rights Reserved</a> </p>
  {{ end }}
  {{ if ne .displayrssicon false }}
  <p class="text-center mb-0">
    <a href="{{ "index.xml" | absURL }}" aria-label="RSS Feed"><i class="fas fa-rss" aria-hidden="true"></i></a>
  </p>
  {{ end }}
  {{ end }}
</footer>
