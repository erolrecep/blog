<nav id="menu-pane" aria-label="Post navigation" class="menu text-center">
  {{ if .IsPage }}
  <div class="pagination-wrapper">
    <ul class="pagination justify-content-center">
      {{ if .Section }}
      {{ with .PrevInSection }}
      <li class="menu-item">
        <a class="menu-item" href="{{ .Permalink }}">&lt; prev</a>
      </li>
      {{ end }}

      <li class="menu-item">
        {{ if .PrevInSection}}
        <span class="menu-item">&nbsp;|&nbsp;</span>
        {{ end}}
        <a class="menu-item" href="{{ .Section | relURL }}">{{ .Section | lower }}</a>
        {{ if .NextInSection}}
        <span class="menu-item">&nbsp;|&nbsp;</span>
        {{ end}}
      </li>

      {{ with .NextInSection }}
      <li class="menu-item">
        <a class="menu-item" href="{{ .Permalink }}">next &gt;</a>
      </li>
      {{ end }}
      {{ end }}
    </ul>
  </div>
  {{ end }}
  <p class="text-center mt-3 mb-0"><a class="menu-item" href="{{ .Site.BaseURL }}">home</a></p>
</nav>
